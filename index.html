<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0f17">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Heart Plan">
<title>Heart Health Plan</title>
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body>
<div id="flash" aria-hidden="true"></div>

<main>
  <header class="top">
    <div class="brand"><svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#151b26"/><path fill="#4cc2ff" d="M32 54C18 44 8 35 8 23c0-7 5-12 12-12 5 0 9 3 12 7 3-4 7-7 12-7 7 0 12 5 12 12 0 12-10 21-24 31z"/></svg>Heart Health Plan</div>
    <button class="iconbtn sm" id="refBtn" data-act="refresh" aria-label="Refresh plan and progress" title="Refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></button>
  </header>

  <section id="v-work" class="view">
    <nav class="days" id="days" aria-label="Day of week"></nav>
    <div id="day"></div>
  </section>

  <section id="v-prog" class="view" hidden></section>
  <p class="foot">Personal project, not medical advice.</p>
</main>

<div class="mini" id="mini" hidden><button data-act="open-player" aria-label="Open live ride"><span class="dot" id="mDot"></span><b id="mName"></b><span class="mclk" id="mClk"></span><span class="mo">Open</span></button></div>

<div class="player" id="player" hidden role="dialog" aria-modal="true" aria-label="Live ride">
  <div class="pl-in">
    <div class="pl-top">
      <button class="iconbtn" data-act="minimize" aria-label="Minimize player"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
      <div class="pl-title"><b id="pTitle"></b><small id="pSub"></small></div>
      <button class="textbtn" id="sndBtn" data-act="sound">Sound: On</button>
    </div>
    <div class="card timer" id="tCard">
      <span class="chg">▶ New segment</span>
      <div class="lbl" id="tSegNo"></div>
      <div class="tname" id="tName"></div>
      <div class="clock" id="tClock">0:00</div>
      <div class="tiles">
        <div class="tile"><div class="lbl">Cadence</div><div class="v" id="tCad"></div><div class="unit">RPM</div></div>
        <div class="tile"><div class="lbl">Resistance</div><div class="v" id="tRes"></div><div class="unit" id="tZone"></div></div>
      </div>
      <p class="cue" id="tCue"></p>
      <div class="bar"><i id="tBar"></i></div>
      <div class="meta"><span id="tDone"></span><span id="tLeft"></span></div>
      <div class="next" id="tNext"></div>
    </div>
    <div class="controls">
      <button class="btn ghost" data-act="prev" aria-label="Previous segment"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
      <button class="btn primary" id="mainBtn" data-act="main">Start</button>
      <button class="btn ghost" data-act="next" aria-label="Next segment"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
    </div>
    <div class="sub"><button class="textbtn" data-act="reset">Reset ride</button></div>
    <div class="hint" id="hint" hidden>
      <span>Tip: set Settings → Display &amp; Brightness → Auto-Lock to Never during rides</span>
      <button class="x" data-act="hint" aria-label="Dismiss tip">✕</button>
    </div>
    <details class="card"><summary id="planSum"></summary><ol class="plan" id="planList"></ol></details>
  </div>
</div>

<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="mText">
  <div class="mbox"><p id="mText"></p>
    <div class="mrow"><button class="btn ghost" data-act="m-cancel">Cancel</button><button class="btn primary" id="mOk" data-act="m-ok">OK</button></div>
  </div>
</div>

<nav class="tabs" aria-label="Sections">
  <div class="in">
    <button class="tab" data-tab="work">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 13.5V9.5M9.5 2.5h5M18.5 6.5 20 5"/></svg>
      <span>Workouts</span>
    </button>
    <button class="tab" data-tab="prog">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 20h18M5 16l4-5 4 3 6-8"/></svg>
      <span>Progress</span>
    </button>
  </div>
</nav>
</body>
</html>
