<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0f17">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="Weekly heart-health plan with a Peloton ride timer">
<title>Heart Health Plan</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0f17'/%3E%3Cpath fill='%234cc2ff' d='M32 54C18 44 8 35 8 23c0-7 5-12 12-12 5 0 9 3 12 7 3-4 7-7 12-7 7 0 12 5 12 12 0 12-10 21-24 31z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="flash" aria-hidden="true"></div>
<main>
  <section id="v-today" class="view"></section>

  <section id="v-ride" class="view" hidden>
    <div class="lbl">Peloton ride</div>
    <div class="chips">
      <button class="chip" data-preset="mon">Mon</button>
      <button class="chip" data-preset="tue">Tue</button>
      <button class="chip" data-preset="wed">Wed</button>
      <button class="chip" data-preset="thu">Thu</button>
      <button class="chip" data-preset="fri">Fri</button>
    </div>
    <div class="sum">
      <div><b id="sumTitle"></b><small id="sumSub"></small></div>
      <button class="link" id="adjBtn" data-act="adjust" aria-expanded="false">Adjust</button>
    </div>
    <div class="card settings" id="settings" hidden>
      <label class="field">Ride type<select id="selType" data-ride="type"></select></label>
      <label class="field">Duration<select id="selDur" data-ride="dur"></select></label>
      <label class="field">Difficulty<select id="selDiff" data-ride="diff"></select></label>
    </div>

    <div class="card timer" id="tCard">
      <span class="chg">▶ New segment</span>
      <div class="lbl" id="tSegNo"></div>
      <div class="tname" id="tName"></div>
      <div class="clock" id="tClock">0:00</div>
      <p class="cue" id="tCue"></p>
      <div class="tiles">
        <div class="tile"><div class="lbl">Cadence</div><div class="v" id="tCad"></div><div class="unit">RPM</div></div>
        <div class="tile"><div class="lbl">Resistance</div><div class="v" id="tRes"></div><div class="unit" id="tZone"></div></div>
      </div>
      <div class="bar"><i id="tBar"></i></div>
      <div class="meta"><span id="tDone"></span><span id="tLeft"></span></div>
      <div class="next" id="tNext"></div>
    </div>

    <div class="controls">
      <button class="btn ghost" data-act="prev" aria-label="Previous segment"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
      <button class="btn primary" id="mainBtn" data-act="main">Start</button>
      <button class="btn ghost" data-act="next" aria-label="Next segment"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
    </div>
    <p class="note" id="note" hidden>Ride restored · tap Resume</p>
    <button class="btn primary mt" id="markBtn" data-act="mark" hidden></button>
    <div class="sub">
      <button class="textbtn" data-act="reset">Reset ride</button>
      <button class="textbtn" id="sndBtn" data-act="sound">Sound: On</button>
    </div>
    <div class="hint" id="hint" hidden>
      <span>Tip: set Settings → Display &amp; Brightness → Auto-Lock to Never during rides</span>
      <button class="x" data-act="hint" aria-label="Dismiss tip">✕</button>
    </div>
    <details class="card">
      <summary id="planSum"></summary>
      <ol class="plan" id="planList"></ol>
    </details>
  </section>

  <section id="v-week" class="view" hidden></section>
</main>

<nav class="tabs" aria-label="Sections">
  <div class="in">
    <button class="tab" data-tab="today">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-9.2-9.3C1.6 7.9 3.8 4.5 7.2 4.5c2 0 3.6 1.1 4.8 2.8 1.2-1.7 2.8-2.8 4.8-2.8 3.4 0 5.6 3.4 4.4 6.7-1.7 4.7-9.2 9.3-9.2 9.3z"/></svg>
      <span>Today</span>
    </button>
    <button class="tab" data-tab="ride">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 13.5V9.5M9.5 2.5h5M18.5 6.5 20 5"/></svg>
      <span>Ride</span>
    </button>
    <button class="tab" data-tab="week">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
      <span>Week</span>
    </button>
  </div>
</nav>

<script src="app.js"></script>
</body>
</html>
